name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".claude/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".claude/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check

  # NOTE (Phase 8 S8h, docs/phase-8-lsp-and-polish.md § Release pipeline):
  # this is intentionally the release+automation BENCHMARK build the doc
  # asks CI to keep — default cargo features, so the `automation` feature
  # (S8a) stays compiled IN. It is NOT the distributed build: the tagged
  # release pipeline (.github/workflows/release.yml, triggers only on `v*`
  # tags) builds the actual shipped binaries with `--no-default-features`
  # so `--automation` is compiled OUT of anything a user downloads.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # (Phase 8 capstone review, P3): the distributed shape
      # (`--no-default-features`, gating the `automation` feature — S8a) is
      # otherwise ONLY compiled at `v*` tag time by release.yml, so a
      # missed `#[cfg(feature = "automation")]` gate would merge green here
      # and fail the release build, blocking a tag push until a fix
      # commit/re-tag. Clippy (not just build) so dead-code-only gate
      # misses fail `-D warnings` too, not just hard errors.
      - name: Clippy (distributed shape, --no-default-features)
        run: cargo clippy -p dv --no-default-features --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build (release)
        run: cargo build --release -p dv
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: dv-${{ matrix.os }}
          path: |
            target/release/dv.exe
            target/release/dv
          if-no-files-found: error

  # Builds the Linux `dv-host` sidecar dv.exe/dv looks for next to itself
  # (docs/phase-5-implementation-plan.md §5, §8 S3). musl (not the native
  # ubuntu-latest gnu target) for a static binary with no glibc-version
  # floor — closes the "other distros" risk without a matrix of them. Tests
  # still run against the native gnu target: real inotify coverage is S4's
  # job (dv-host's S1-scope handlers don't touch it yet), this just proves
  # the crate's own test suite passes on Linux.
  host-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build (release, musl)
        run: cargo build --release -p dv-host --target x86_64-unknown-linux-musl
      - name: Test
        run: cargo test -p dv-host
      - name: Upload dv-host sidecar
        uses: actions/upload-artifact@v4
        with:
          name: dv-host-linux-x64
          path: target/x86_64-unknown-linux-musl/release/dv-host
          if-no-files-found: error

  # Builds the native Linux `dv` CLI sidecar (docs/phase-8-lsp-and-polish.md
  # § Distribution & first-run, Phase 8 S8b/S8c): on first use per WSL
  # distro, dv installs this musl binary WSL-side as `~/.local/bin/dv`,
  # version-synced by content hash exactly like `dv-host` above. Same musl
  # rationale as `host-linux` (static, no glibc-version floor). The
  # `dv-cli` crate is deliberately gpui-free (see its Cargo.toml) so this
  # job never pulls in gpui/zed at all — a fast build is itself a
  # regression check for that. NOTE (release.yml, S8h): the artifact here
  # is named `dv-cli-linux-x64` but the FILE inside is `dv-cli` — the
  # release bundle step must rename it to `dv-linux-x64` (the name
  # `install.rs`'s `CLI_SPEC`/`sidecar_path()` actually looks for next to
  # the app binary), mirroring the exact host-linux naming trap called out
  # in docs/backlog.md.
  cli-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build (release, musl)
        run: cargo build --release -p dv-cli --target x86_64-unknown-linux-musl
      - name: Test
        run: cargo test -p dv-cli
      - name: Upload dv-cli sidecar
        uses: actions/upload-artifact@v4
        with:
          name: dv-cli-linux-x64
          path: target/x86_64-unknown-linux-musl/release/dv-cli
          if-no-files-found: error
