[workspace]
resolver = "3"
members = ["crates/app", "crates/cli", "crates/core", "crates/host"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# gpui must use the EXACT same git spec as gpui-component declares internally
# (currently un-pinned zed main), or cargo resolves two incompatible copies of
# gpui and nothing type-checks across the boundary. Reproducibility comes from
# the committed Cargo.lock, not from a rev here. See CLAUDE.md before touching.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
# Enable the tree-sitter grammars we highlight diffs with. This is a curated
# set (TypeScript-first, plus common infra/config languages); unlisted
# extensions simply render unhighlighted. Widen the list to add languages.
gpui-component = { git = "https://github.com/longbridge/gpui-component", features = [
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-javascript",
    "tree-sitter-jsdoc",
    "tree-sitter-rust",
    "tree-sitter-python",
    "tree-sitter-go",
    "tree-sitter-css",
    "tree-sitter-html",
    "tree-sitter-yaml",
    "tree-sitter-toml",
    "tree-sitter-bash",
    "tree-sitter-markdown",
] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
ropey = "=2.0.0-beta.1"
anyhow = "1"
dv-core = { path = "crates/core" }
# The agent-CLI/GUI-shared submit/pr/author logic (S8b) — a gpui-free
# workspace member so it can also build as the native Linux `dv-cli`
# binary the WSL provisioner installs (crates/core/src/remote/install.rs's
# `CLI_SPEC`). Never add a gpui dependency to this crate, even transitively.
dv-cli = { path = "crates/cli" }
# dv-host's RPC channel (crates/core/src/remote/): payloads ride base64 in
# JSON so binary bytes need no raw-frame protocol. sha2 (S3, remote/install.rs's
# client-side sidecar hash verification).
base64 = "0.22"
sha2 = "0.10"
# Real file watching (crates/core/src/review/watch.rs's local arm; S4 adds
# crates/host/src/watch.rs, which watches INSIDE the distro over inotify).
# Declared once here so dv-core and dv-host can't drift onto different
# `notify` versions.
notify = "8"

# GPUI is unusably janky fully unoptimized; optimize dependencies even in dev.
# Our own crates stay at opt-level 0 for fast incremental builds.
[profile.dev.package."*"]
opt-level = 2
