[package]
name = "dv"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
dv-cli.workspace = true
dv-core.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
ropey.workspace = true
futures = "0.3"
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
dirs = "6.0.0"
# Only used by automation/capture.rs's PNG screenshot encoder — optional so
# it drops out of the `--no-default-features` release build along with the
# rest of the automation surface (see the `automation` feature below).
png = { version = "0.17", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["automation"]
# `dv --automation`: the JSON-over-stdio control channel (crates/app/src/
# automation/) used for dev/CI-driven UI verification. Default-on so
# `cargo build -p dv` keeps today's behavior; the distributed release build
# (docs/phase-8-lsp-and-polish.md § Release) compiles with
# `--no-default-features` so the shipped binary carries no automation
# surface at all (see main.rs's `#[cfg(feature = "automation")]` gates).
automation = ["dep:png"]
