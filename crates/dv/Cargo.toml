[package]
name = "dv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "dv: local diff and PR review (docs/PLAN.md)"

build = "build.rs"
# `cargo run -p dv` is the console binary.
default-run = "dv"

# The two binaries share everything in the library (`src/lib.rs`, PLAN §13.1).
[lib]
path = "src/lib.rs"
doctest = false

# The console program: the CLI, `dv backend --stdio`, and `dv` / `dv open` starting the app.
[[bin]]
name = "dv"
path = "src/main.rs"
test = false

# The binary that runs the app in its own process: on Windows the windows-subsystem one (the
# Start menu's shortcut), on macOS the app bundle's; Velopack's main executable on both. Only
# with the app; Linux ships `dv` alone.
[[bin]]
name = "dv-gui"
path = "src/bin/dv-gui.rs"
required-features = ["gui"]
test = false

# Three shapes (docs/PLAN.md §13.1), all linted by `script/check` step 2:
# - default (`gui` + `automation`): development, tests and the e2e runner;
# - `--no-default-features --features gui`: the app as it ships on Windows, macOS and a Linux
#   desktop;
# - `--no-default-features`: headless, the CLI and `dv backend --stdio` without gpui, which is
#   the static musl build installed into WSL distros (`script/check` step 3 keeps gpui out).
[features]
default = ["gui", "automation"]
# The app: `dv` alone and `dv open` open a window. Without it they exit 2 and say to open the
# repository from Windows (`windowless`).
gui = [
    "dep:anyhow",
    "dep:dirs",
    "dep:dv_ui",
    "dep:gpui",
    "dep:gpui_appearance",
    "dep:gpui_platform",
    "dep:libc",
    "dep:objc2",
    "dep:velopack",
    "dep:windows-sys",
]
# `--automation`: the JSONL driver used by the e2e scenarios (docs/PLAN.md §14). Shipped builds
# are built without it (PLAN D9).
# It also seeds fixture repos for scenarios (`seed_repo`, PLAN §14.2) with `dv_test_support`,
# which, like `dv_core`, never depends on gpui, and reaches them through a loopback
# `dv backend --stdio` it can kill and block (`dv_backend`, PLAN §5.2). `gpui_automation`
# (toolbox-rs) stays optional here, unlike in `dv_ui`: the headless build must not reach gpui.
automation = [
    "gui",
    "dep:dv_backend",
    "dep:dv_test_support",
    "gpui_automation/enabled",
    "dep:serde",
    "dep:serde_json",
    "dep:toolbox_process",
    "dv_ui/automation",
]

[dependencies]
anyhow = { workspace = true, optional = true }
clap.workspace = true
dirs = { workspace = true, optional = true }
dv_backend = { workspace = true, optional = true }
# The headless commands (PLAN §10), dispatched before any gpui code runs.
dv_cli.workspace = true
dv_core.workspace = true
dv_test_support = { workspace = true, optional = true }
dv_ui = { workspace = true, optional = true }
env_logger.workspace = true
gpui = { workspace = true, optional = true }
# What the platform can show, probed at startup, and automation's `state` of it (`app`).
gpui_appearance = { workspace = true, optional = true }
gpui_automation = { workspace = true, optional = true }
gpui_platform = { workspace = true, optional = true }
log.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# The agent's `dv` commands a scenario plays (`automation::agent_cli`), with no console window.
toolbox_process = { workspace = true, optional = true }

# Velopack (PLAN D9): on Windows its install, update and uninstall hooks, and on Windows and
# macOS an installed copy's updates (`installer`, `updates`): the app's, never the headless
# build's.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
velopack = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
# The fatal-error message box of the detached app, which has no console (`fatal.rs`), and the
# flags and handle inheritance it is started detached with (`launch.rs`, PLAN §13.1), and the
# other dv processes of an install an update would stop (`processes.rs`, PLAN D9).
windows-sys = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# The detached app's own session and descriptors (`launch.rs`, PLAN §13.1), and on macOS the
# other dv processes of an install an update would stop (`processes.rs`): the app's, never the
# headless build's.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

# A Linux desktop's window system: X11, and Wayland where the session has it (gpui prefers it
# when `WAYLAND_DISPLAY` is set). Automation runs under X11 alone, on an Xvfb display
# (toolbox-rs `gpui_automation`'s X11 captures, PLAN §14.2).
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, optional = true, features = ["wayland", "x11"] }

# macOS (PLAN §13.1): text through Core Text needs gpui's `font-kit` (without it nothing draws),
# and `runtime_shaders` compiles the Metal shaders when the window opens, so building needs no
# Metal toolchain (Xcode's is a separate download).
[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { workspace = true, optional = true, features = ["font-kit", "runtime_shaders"] }
# The app's icon in the Dock and the app switcher when it runs outside an app bundle
# (`dock_icon.rs`, PLAN §13.1): the app's, never the headless build's.
objc2 = { workspace = true, optional = true }

# dv.exe's and dv-gui.exe's icon and version resource on Windows (`build.rs`); a no-op elsewhere.
[build-dependencies]
embed-resource.workspace = true

# The unit tests that need gpui are gated on `gui`; `tests/*` run in every shape.
[dev-dependencies]
dv_backend.workspace = true
dv_test_support.workspace = true
gpui = { workspace = true, features = ["test-support"] }
# The app icon's test renders its SVG and reads and writes the .ico (`tests/app_icon.rs`).
png.workspace = true
pretty_assertions.workspace = true
resvg.workspace = true
serde_json.workspace = true
tempfile.workspace = true
