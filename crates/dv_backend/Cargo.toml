[package]
name = "dv_backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The stdio protocol, the dv backend --stdio server loop, RemoteBackend and the distro install (docs/PLAN.md §5)"

# gpui: never, not even transitively (`script/check` step 3).
[lib]
path = "src/lib.rs"
doctest = false

# A test helper, never shipped (only `dv` is): the process the conformance suite's process cases
# spawn, and their child-process loopback server (`tests/conformance/process.rs`, which finds it
# as `CARGO_BIN_EXE_dv_test_child`).
[[bin]]
name = "dv_test_child"
path = "src/bin/dv_test_child.rs"
test = false
doc = false

[dependencies]
base64.workspace = true
dv_core.workspace = true
log.workspace = true
parking_lot.workspace = true
serde.workspace = true
# `RawValue`: the client's reader thread routes a reply without parsing its value, which the
# waiting call parses into the type it expects (`client::link`).
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
thiserror.workspace = true
toolbox_process.workspace = true

[dev-dependencies]
dv_test_support.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true
