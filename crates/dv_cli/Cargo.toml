[package]
name = "dv_cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The dv command tree, JSON DTOs and setup/doctor checks (docs/PLAN.md §10, §12)"

# gpui: never, not even transitively (`script/check` step 3).
[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
clap.workspace = true
dv_backend.workspace = true
dv_core.workspace = true
# The user's shell's `PATH` inside a distro (`dv doctor`'s CLI-on-PATH check), read as the
# language servers' resolver reads it (`dv_lsp::resolve::shell`).
dv_lsp.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
toolbox_process.workspace = true

# The user `Path` in the registry and the broadcast that tells running programs it changed
# (`checks::user_path`, PLAN §12.2).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
dv_test_support.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true
