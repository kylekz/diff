[package]
name = "dv_ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "dv's views and services (docs/PLAN.md §11)"

[lib]
path = "src/lib.rs"
doctest = false

[features]
# The automation seam re-exports toolbox-rs's `gpui_automation` (docs/PLAN.md §14), whose driver
# this turns on; without it the seam is the crate's no-op stand-ins. The dv binary enables it
# through its own `automation` feature.
automation = ["gpui_automation/enabled"]

[dependencies]
anyhow.workspace = true
dv_backend.workspace = true
dv_cli.workspace = true
dv_core.workspace = true
dv_lsp.workspace = true
futures.workspace = true
gpui.workspace = true
gpui-base.workspace = true
gpui-component.workspace = true
gpui_appearance.workspace = true
gpui_automation.workspace = true
log.workspace = true
markdown.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tree-sitter.workspace = true

[dev-dependencies]
dv_test_support.workspace = true
gpui = { workspace = true, features = ["test-support"] }
pretty_assertions.workspace = true
tempfile.workspace = true
