[package]
name = "dv-host"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "dv-host"
path = "src/main.rs"

# S1-S3 kept dv-core out of this binary's real deps (only reached it via
# [dev-dependencies], to drive the shipped binary through the real
# HostClient in tests/) — S4 (watching) changes that: crates/host/src/watch.rs
# reuses dv-core's `resolve_local_git_dir` (review/io.rs, re-exported as
# `dv_core::review::resolve_local_git_dir`) instead of hand-rolling gitdir
# resolution a second time. The plan always allowed this ("Dependencies:
# dv-core, anyhow, serde, serde_json, base64, notify" — plan §1); dv-core
# itself has no gpui import (ever — see CLAUDE.md) and everything it pulls
# in (imara-diff, notify, sha2, base64, serde) is pure Rust, so this stays
# musl-friendly. NO gpui in this crate, ever, regardless.
[dependencies]
anyhow.workspace = true
base64.workspace = true
dv-core.workspace = true
notify.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
